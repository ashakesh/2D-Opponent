[project]
name = "fightsim"
version = "0.4.1"
description = "Deterministic two-player fighting simulator for ML research"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
play = ["pygame>=2.5"]
dev = ["pytest>=7.0"]

[project.scripts]
fightsim-play = "fightsim.play:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["fightsim*"]

[tool.setuptools.package-data]
fightsim = ["assets/fighters/**/*", "assets/fonts/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
